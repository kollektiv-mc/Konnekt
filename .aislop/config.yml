# This repo's aislop config. The policy is base.yml beside it, vendored from
# kollektiv by its scripts/sync-aislop.sh and never edited here: which engines
# run, which two style rules are off and why, the scoring, failBelow 100,
# telemetry off. Only this tree's numbers live in this file. Run locally with
# `npx --yes aislop@0.16.0 scan`; CI runs `aislop ci` through the vendored
# .github/workflows/aislop.yml, which pins aislop and ruff.
#
# The `./` is load-bearing: aislop resolves `extends` relative to this file, and
# `base.yml` without it silently loads nothing.
extends: ./base.yml

quality:
  # A ratchet, not a target: each number sits at today's largest function or
  # file so the gate is green, and is lowered as #314 shrinks the entries in
  # its table. Never raised. The tool multiplies maxFileLoc by 1.5 for .go and
  # .tsx and maxFunctionLoc by 2 for a React component, then allows 10% over.
  #
  # maxFunctionLoc 350: held by useMods (tiles/mods/useMods.ts, 384 lines).
  # Next stops when it is split: registerBuiltins 267, heroSphere 192,
  # identifyUnknownLocked 168, useBackups 142, then 80 (the tool's default).
  maxFunctionLoc: 350
  # maxFileLoc 970: held by backend/services/server.go, which at 1651 lines is
  # now past the 1455 the 1.5x multiplier allows and reports as a warning.
  # Left where it is rather than raised: the number is the target #314 works
  # toward, and one warning does not move the score off 100. Next stops:
  # modservice.go 1089, backup.go 1017, GraphEditor.tsx 1010,
  # SettingsModal.tsx 884, then 400 (the default).
  maxFileLoc: 970
