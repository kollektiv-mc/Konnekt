name: Konnekt CodeQL config

# Two kinds of exclusion, and only two. Nothing here suppresses a query or
# lowers a severity: an alert this repo disagrees with gets dismissed on the
# alert itself, with a reason recorded, rather than made invisible in a config
# file where nobody reviewing a pull request would see it.
paths-ignore:
  # Generated by `wails generate module`, and agent_docs/CLAUDE.md's "Do not"
  # list forbids editing it by hand. A finding here is a finding about Wails'
  # generator, which is not a thing this repo can fix or usefully triage.
  - frontend/wailsjs

  # Generated by `pnpm gen:tokens` from tokens.source.json, which is itself
  # vendored from kollektiv. Same reasoning: a hand edit is reverted on the next
  # sync, so an alert here has nowhere to be fixed.
  - frontend/src/styles/tokens.ts

  # Build output. `frontend/dist/` is gitignored but is present in the
  # workspace by the time the Go extractor runs, because the embed directive
  # requires it, and scanning a bundle means scanning every dependency's
  # minified source as if this repo wrote it.
  - frontend/dist
  - demo/dist

# `demo/` and `website/` are deliberately NOT excluded. Neither ships in the
# binary, but both are served to real browsers from a public domain, and
# scripts/check-website-scenes.mjs already carries a note about a DOM-text
# finding in that code - which is precisely the class of thing this should keep
# watching rather than stop looking at.
