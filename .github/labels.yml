# The label vocabulary this repo's tooling relies on.
#
# This file is a *declaration*, not a mirror: GitHub holds the live state and
# nothing syncs this to it. It exists so the labels the issue forms apply are
# reviewable in a diff, and so frontend/scripts/check-issue-templates.mjs can
# fail a template that references a label which does not exist. That failure is
# worth catching because GitHub silently ignores an unknown label rather than
# erroring, so a typo means the label quietly never gets applied and triage
# breaks with no signal at all.
#
# Two owners, and the difference decides whether a local edit survives:
#
#   Suite-owned: `type:*`, `area:ui`, `area:agents`, `p0`-`p3` and
#   `changelog:skip` come from kollektiv's design/labels.json. Its
#   scripts/sync-labels.sh runs `gh label create`/`gh label edit` from that
#   source against every repo in suite.repos.json, which lists Konnekt. The
#   colors and descriptions below are copied verbatim from it and have to stay
#   that way: a local edit is both invisible and reported as drift on the next
#   sync. kollektiv's docs/conventions.md is blunt about the scope of this:
#   "A repo does not invent its own type or priority labels."
#
#   Konnekt-owned: the per-area `area:*` labels, `milestone:*` and `status:*`.
#   sync-labels.sh is explicitly non-destructive ("nothing here deletes a label
#   — including ones outside this taxonomy, since a repo may carry its own
#   labels this suite doesn't govern"), so these are safe to define here. They
#   also have no sync of their own: creating them on GitHub is a manual
#   `gh label create` per label, which is why this file is the only reviewable
#   record of what should exist.
#
# Only labels something depends on are listed. GitHub's remaining stock labels
# (duplicate, good first issue, help wanted, invalid, wontfix) still exist on
# the repo and are fine to use by hand; they are left out because no template,
# workflow or script names them. The same goes for the suite's `blocked` and
# `health-check`: they exist on the repo but nothing here reads them.

# Sorts a merged pull request into a release-notes section. Required on every
# pull request by CI's `pr-labelled` job, and read by
# .github/scripts/release-notes.py and .github/release.yml. The issue forms
# apply type:bug and type:feature on creation.
#
# The label is the *only* input to that sorting - nothing reads the title - so
# these descriptions have to be decidable by whoever applies one, in the label
# picker, without opening a document. They are the short form of the ladder in
# CONTRIBUTING.md and agent_docs/CLAUDE.md: can a user tell the difference at
# all (no -> chore/docs), was the app already meant to do it (yes -> bug),
# otherwise feature. What went wrong before these were sharpened was #97, a
# repair filed as a feature because the repair happened to add a row of UI.
#
# Suite-owned. Verbatim from design/labels.json, colors included.
- name: 'type:bug'
  color: 'eb5757'
  description: Existing behavior is wrong. Still a bug when the repair adds new code or new UI.
- name: 'type:feature'
  color: 'bb87fc'
  description: 'New capability: the product can now do something it never offered.'
- name: 'type:docs'
  color: '0b84a5'
  description: Documentation only. Counted in the release notes, not listed.
- name: 'type:chore'
  color: '8792a2'
  description: 'No user-visible change: refactors, tests, CI, deps. Counted in the notes, not listed.'

# Which part of the product. One per option in the issue forms' "Which part of
# Konnekt?" dropdown, whose list comes from frontend/src/tiles/registry.ts plus
# the four app-level areas that are not tiles.
#
# These exist because the area had nowhere else to live. website/roadmap.js
# files each issue into a folder, and it used to read the area by parsing the
# dropdown answer out of the issue *body* - a heading only the forms produce.
# Every maintainer-filed issue therefore landed in `requested/` no matter what
# it was about, and the area leaked into issue titles instead: fifteen
# consecutive scheduler issues each said "scheduler" in the title, because
# `area:ui` did not say which tile and nothing else could.
#
# One shared color on purpose: these answer one question, and a reader scanning
# the list should see them as a family rather than fifteen unrelated tags.
#
# Konnekt-owned.
- name: 'area:console'
  color: 'bfd4f2'
  description: Console tile - live output, log streaming.
- name: 'area:commands'
  color: 'bfd4f2'
  description: Quick commands and custom command buttons.
- name: 'area:stats'
  color: 'bfd4f2'
  description: Stats tile - live server figures.
- name: 'area:players'
  color: 'bfd4f2'
  description: Players tile - roster, kick and ban.
- name: 'area:performance'
  color: 'bfd4f2'
  description: Performance tile - charts and history.
- name: 'area:scheduler'
  color: 'bfd4f2'
  description: Scheduler tile - graphs, blocks, triggers, the node editor.
- name: 'area:worlds'
  color: 'bfd4f2'
  description: Worlds tile - world saves, dimensions, the 3D scene.
- name: 'area:backups'
  color: 'bfd4f2'
  description: Backups tile - create, restore, retention.
- name: 'area:config'
  color: 'bfd4f2'
  description: Server config tile - server.properties and the file editor.
- name: 'area:notifications'
  color: 'bfd4f2'
  description: Notifications tile and OS desktop notifications.
- name: 'area:mods'
  color: 'bfd4f2'
  description: Plugins and mods - Modrinth browsing, install, updates.
- name: 'area:layout'
  color: 'bfd4f2'
  description: Tile layout and dashboard - the grid, presets, crate drag.
- name: 'area:settings'
  color: 'bfd4f2'
  description: Settings page and app-level preferences.
- name: 'area:server-setup'
  color: 'bfd4f2'
  description: Server setup, install and launch - jars, loaders, JVM args.
- name: 'area:updater'
  color: 'bfd4f2'
  description: The in-app updater and its snapshot channel.

# Suite-owned area labels. Verbatim from design/labels.json.
#
# `area:ui` is kept declared because the suite defines it and sync-labels.sh
# recreates it, so deleting it here would be undone on the next run. Konnekt
# does not apply it any more: "user-facing interface work" describes almost
# every issue in this repo and so sorts nothing. Use a specific area instead.
# The issues already carrying it are cleared in the #94 backfill pass.
# `area:agents` is not a product area and stays in use as-is.
- name: 'area:ui'
  color: 'aed9e0'
  description: User-facing interface work.
- name: 'area:agents'
  color: 'f9e2ae'
  description: suite-kit skills, agents, and Claude Code configuration.

# Which milestone in agent_docs/ROADMAP.md the work belongs to. Drives which
# Linear milestone a mirrored issue lands in, and which stage badge
# website/roadmap.js prints.
#
# `milestone:later` exists because the roadmap page used to infer it: any issue
# without `milestone:beta` was drawn as LATER, which collapsed three different
# states into one badge - real Later scope, the five-phase Remote Access
# programme, and "nobody has staged this yet". Stage is now something an issue
# says rather than something the absence of a label implies.
#
# Konnekt-owned.
- name: 'milestone:beta'
  color: 'ededed'
  description: Beta scope.
- name: 'milestone:remote-access'
  color: 'ededed'
  description: Remote Access scope.
- name: 'milestone:later'
  color: 'ededed'
  description: Later scope. Breadth, once the foundations are proven.

# How urgent. Exactly one per issue, per kollektiv's docs/conventions.md
# § Priority. Backfilling these onto the issues that predate the rule is #94.
#
# Suite-owned. Verbatim from design/labels.json, colors included - a repo does
# not invent its own priority scale, and these four are the whole of it.
- name: 'p0'
  color: 'b60205'
  description: Drop everything.
- name: 'p1'
  color: 'd93f0b'
  description: High priority, next up.
- name: 'p2'
  color: 'fbca04'
  description: Medium priority, normal queue.
- name: 'p3'
  color: 'c2e0c6'
  description: Low priority, nice to have.

# Triage state. Every issue form applies status:needs-triage on creation; the
# other two are set by a maintainer. Coloured, unlike most of the set above,
# because triage state is the one thing worth spotting at a glance in a list.
#
# Konnekt-owned.
- name: 'status:needs-triage'
  color: 'fbca04'
  description: Newly filed. Not yet reproduced, deduplicated or scoped.
- name: 'status:needs-info'
  color: 'c5def5'
  description: Waiting on the reporter for something before it can go further.
- name: 'status:confirmed'
  color: '0e8a16'
  description: Reproduced or accepted, and in scope. Ready to be worked on.

# Applied by the Question issue form. GitHub stock label, used rather than a
# `type:` one on purpose: the `type:` prefix drives the changelog categories and
# the pr-labelled gate, and a question belongs in neither.
- name: 'question'
  color: 'd876e3'
  description: Further information is requested

# Suite-owned. Verbatim from design/labels.json.
- name: 'changelog:skip'
  color: '8792a2'
  description: Leave this pull request out of the release notes entirely.

# GitHub stock labels that predate the type: scheme and duplicate it on issues
# #52 and #53. .github/release.yml deliberately maps both spellings in its
# fallback path, so retiring them means editing that file too. Left declared
# until that cleanup happens.
- name: 'bug'
  color: 'd73a4a'
  description: Something isn't working
- name: 'enhancement'
  color: 'a2eeef'
  description: New feature or request
- name: 'documentation'
  color: '0075ca'
  description: Improvements or additions to documentation
