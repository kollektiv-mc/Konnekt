# Layout for GitHub's auto-generated release notes. Vendored into every product
# as .github/release.yml by kollektiv's scripts/sync-notes.sh, beside the
# generator; edit it there.
#
# This is a fallback, not the normal path: a release workflow reads this file
# only when .github/scripts/release-notes.py could not produce a body, which is
# the very first release, with no baseline to measure from, or an API failure.
#
# The generator exists because GitHub's cannot do what a shipped build's
# changelog needs. It cannot leave out pull requests that changed nothing in
# what ships (each product's .github/changelog.json names those paths), and it
# cannot tell a maintenance change from a user-facing one beyond the label it
# was given. So the sections below are the degraded view, and the script's
# Features / Fixes / Other changes are the real one. Two differences are worth
# knowing when you read a fallback body, because it will look noisier:
#
#   * Everything appears, including docs, CI and repo tooling. The script
#     counts those in a footer line instead of listing them.
#   * Maintenance and documentation get their own headings here rather than
#     being folded into that count, because a heading is all this file can do.
#
# The titles are kept in step with the script deliberately: a reader should not
# have to learn two vocabularies depending on which path produced the notes.
#
# Entries are merged pull requests, listed by title and sorted into the first
# category whose label matches, so order matters here and "*" has to come last.
# CI's pr-labelled gate requires a type: label on every pull request, so the
# catch-all should stay empty in practice; if things start landing there, that
# gate is not doing its job.
changelog:
  exclude:
    labels:
      - changelog:skip
  categories:
    - title: Features
      labels:
        - type:feature
        - enhancement
    - title: Fixes
      labels:
        - type:bug
        - bug
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Maintenance
      labels:
        - type:chore
    - title: Other changes
      labels:
        - '*'
