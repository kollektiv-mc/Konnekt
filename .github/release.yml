# Layout for GitHub's auto-generated release notes — used by
# workflows/release.yml's `--generate-notes` on tagged releases.
#
# The nightly snapshot no longer reads this file. It builds its own notes in
# scripts/snapshot-notes.py, because GitHub's generator cannot leave out
# website-only pull requests — the website ships to Cloudflare Pages, not into
# the binary — and cannot sort an unlabelled pull request into anything but the
# catch-all below. That script's section titles are a subset of the ones here
# on purpose: a reader comparing a snapshot against a release should not have
# to learn two vocabularies.
#
# Entries are merged pull requests, listed by title and sorted into the first
# category whose label matches, so order matters here and "*" has to come last.
# A PR with no type: label still appears, under "Other changes" — categories
# sharpen the list as labelling gets more consistent, they don't gate what
# shows up. This file is the one place section titles are decided; changing a
# title here changes every future release's notes.
changelog:
  exclude:
    # Not a label that exists yet — create it if you want an escape hatch for
    # PRs that shouldn't show up in the notes at all.
    labels:
      - changelog:skip
  categories:
    - title: Features
      labels:
        - type:feature
        - enhancement
    - title: Fixes
      labels:
        - type:bug
        - bug
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Maintenance
      labels:
        - type:chore
    - title: Other changes
      labels:
        - '*'
