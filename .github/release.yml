# Layout for GitHub's auto-generated release notes. This is now a fallback, not
# the normal path: neither the snapshot nor a tagged release reads this file
# unless scripts/release-notes.py could not produce a body — the very first
# release, which has no baseline to measure from, or an API failure.
#
# Both workflows build their notes with that script instead, because GitHub's
# generator cannot do either of the things a shipped build's changelog needs. It
# cannot leave out website-only pull requests — the website lives in this repo
# but ships to Cloudflare Pages, not into the binary — and it cannot sort an
# unlabelled pull request into anything but the catch-all below, which is where
# nearly every pull request here ended up.
#
# So the sections below are the degraded view, and the script's Features /
# Fixes / Other changes are the real one. The titles are kept in step
# deliberately: a reader should not have to learn two vocabularies depending on
# which path produced the notes they are looking at.
#
# Entries are merged pull requests, listed by title and sorted into the first
# category whose label matches, so order matters here and "*" has to come last.
# A PR with no type: label still appears, under "Other changes" — categories
# sharpen the list as labelling gets more consistent, they don't gate what
# shows up.
changelog:
  exclude:
    # Not a label that exists yet — create it if you want an escape hatch for
    # PRs that shouldn't show up in the notes at all.
    labels:
      - changelog:skip
  categories:
    - title: Features
      labels:
        - type:feature
        - enhancement
    - title: Fixes
      labels:
        - type:bug
        - bug
    - title: Documentation
      labels:
        - type:docs
        - documentation
    - title: Maintenance
      labels:
        - type:chore
    - title: Other changes
      labels:
        - '*'
