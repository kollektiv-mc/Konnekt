name: CI

on:
  push:
    branches: [main]
  # `labeled`/`unlabeled` are here for the pr-labelled job below: adding the
  # missing label has to be able to turn that check green without an empty
  # commit to re-trigger it. Listing types at all overrides the default set,
  # so the three defaults are repeated.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merged PR titles are the release notes, and a `type:` label is what files
  # each one under a heading. Until now that was a review convention, and the
  # result was that 24 of the 41 pull requests in the first release window
  # carried no label at all — so .github/scripts/release-notes.py had to guess
  # from the title, and guessing put a website polish pass and a CI change into
  # the "Features" users read first.
  #
  # The label is the input that makes the generator's output correct, so it is
  # checked in the same place as everything else the build depends on rather
  # than left to whoever opens the pull request to remember.
  pr-labelled:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Via env rather than interpolated into the script: label names are
      # attacker-shaped text as far as a shell is concerned, and `${{ }}` inside
      # a run block is substituted before bash ever sees it.
      - name: 'A type: label decides where this lands in the release notes'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "labels: $LABELS"
          if echo "$LABELS" | jq -e 'any(.[]; startswith("type:"))' > /dev/null; then
            exit 0
          fi
          echo "::error::This pull request has no type: label, so the release notes cannot file it. Add type:feature, type:bug, type:chore or type:docs — see agent_docs/CLAUDE.md's 'Commits & pull requests'."
          exit 1

  # The classifier decides what every future release says about itself, and it
  # is the one piece of release tooling that never runs until a release is being
  # cut — which is the worst moment to find out it is wrong. These are pure,
  # offline checks over the categorisation and the path filter.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 .github/scripts/release-notes_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The lefthook pre-commit hook only formats *staged* files, so it can
      # never clean anything already committed, nor the config files outside
      # its *.{ts,tsx,css} glob. That gap is what let 33 files drift red
      # unnoticed; this step is what stops it recurring.
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-bundle

      # The token layer is generated from the vendored tokens.source.json and
      # committed. A non-empty diff means either a generated file was
      # hand-edited — that edit is destroyed on the next run, and whatever it
      # was papering over survives — or tokens.source.json was refreshed
      # without regenerating. .claude/suite.json has described this check for a
      # while; until now only an agent running /suite-kit:health ever ran it.
      - run: pnpm gen:tokens

      # ../website/tokens.css is the third output: the marketing site consumes the
      # same token source as plain :root custom properties, having previously
      # hand-copied them. It is outside this job's working-directory, hence the ..
      - name: Token layer is in sync
        run: git diff --exit-code src/styles/tokens.css src/styles/tokens.ts ../website/tokens.css

  # website/ ships to Cloudflare Pages, which watches this branch and is
  # configured outside this repo, so there is no deploy workflow here to hang a
  # check off. It has no build step, no package.json and no node_modules, so
  # nothing else in this workflow would ever open one of its files: before this
  # job it was the largest user-facing surface in the repo with no gate at all.
  #
  # Prettier comes from frontend/, the only place in the repo that has it. One
  # version, two configs: website/.prettierrc.json is the frontend's minus the
  # Tailwind class-sorting plugin, because the site is not Tailwind.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm format:website
        working-directory: frontend

      # Zero dependencies, no network: resolves the site's own hrefs, CSS url()s
      # and sitemap entries against the files on disk. A renamed image or a
      # retitled section is otherwise only found by loading the page.
      - run: node scripts/check-website-links.mjs

      # The changelog page shows only the "What's changed" section of a release
      # body. A regex that cuts in the wrong place truncates the public
      # changelog and looks like a short release rather than a bug.
      - run: node scripts/check-release-notes-extract.mjs

  # .claude/suite.json declares three sections. CI has always covered
  # `commands` as literal steps above and in the backend jobs, but nothing ever
  # ran `invariants` or `generated` — they only executed when a human invoked
  # /suite-kit:health with the plugin installed. So the `no literal border
  # widths` invariant guarded nothing on a push.
  #
  # This job runs those two sections through the vendored runner, which reads
  # the same manifest the skill does. `commands` is deliberately left out: the
  # backend legs below run on windows-latest and in a webkit2gtk container, and
  # suite.json's flat command list cannot express that matrix. Running it here
  # too would add a second failure surface for coverage CI already has.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The `generated` section runs `pnpm gen:tokens` and diffs its output, so
      # the frontend's dependencies have to be installed first.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      # --require-runnable turns a skip into a failure. Every check in these two
      # sections can run here, so a skip means something broke in the setup
      # above rather than a check that legitimately does not apply.
      - name: Invariants and generated files
        run: ./.claude/suite-check.py --section invariants --section generated --require-runnable

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # main.go's //go:embed all:frontend/dist requires the built bundle to
      # exist before go vet/test/build (they compile the embed directive).
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            Write-Host $files
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      # Threshold and rationale live in the script, which .claude/suite.json also
      # runs, so /suite-kit:health enforces the same floor locally.
      - run: go run ./scripts/coverage-floor

  backend-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Only shipping platform whose !windows Go code (server_linux.go,
      # server_unix.go, server_other.go) isn't otherwise compiled anywhere in
      # CI — the windows-latest backend job above never touches those files.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          # The workspace is bind-mounted from the host and owned by a
          # different uid than this container's root, so git refuses to touch
          # it — which breaks go build's VCS stamping (exit 128).
          # actions/checkout sets this too, but only in a temporary global
          # config that doesn't survive its own step.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - run: go vet ./...
      - run: go test ./...
      - run: go build -tags webkit2_41 ./...
