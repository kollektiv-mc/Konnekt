name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The lefthook pre-commit hook only formats *staged* files, so it can
      # never clean anything already committed, nor the config files outside
      # its *.{ts,tsx,css} glob. That gap is what let 33 files drift red
      # unnoticed; this step is what stops it recurring.
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-bundle

      # The token layer is generated from the vendored tokens.source.json and
      # committed. A non-empty diff means either a generated file was
      # hand-edited — that edit is destroyed on the next run, and whatever it
      # was papering over survives — or tokens.source.json was refreshed
      # without regenerating. .claude/suite.json has described this check for a
      # while; until now only an agent running /suite-kit:health ever ran it.
      - run: pnpm gen:tokens

      - name: Token layer is in sync
        run: git diff --exit-code src/styles/tokens.css src/styles/tokens.ts

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # main.go's //go:embed all:frontend/dist requires the built bundle to
      # exist before go vet/test/build (they compile the embed directive).
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            Write-Host $files
            exit 1
          }

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

      # Coverage floor for backend/services — the package agent_docs/
      # HEALTH_CHECKLIST.md tracks. Scoped to that package on purpose: the repo
      # root and backend/models carry no test files, so a ./... figure would be
      # diluted by packages this floor is not about and would drift for reasons
      # unrelated to test quality.
      #
      # The floor sits a little under the measured number so an unrelated
      # refactor does not redden the build. It is a ratchet: raise it when
      # coverage rises, never lower it to make a red build green.
      #
      # The -coverprofile=/-func= arguments are quoted deliberately. PowerShell
      # splits an unquoted native-command argument on '=', which reaches the tool
      # as two arguments: `go tool cover` answers "too many arguments" and
      # `go test` writes its profile to a file named `coverage`. Both fail in
      # ways that look unrelated to coverage, so leave the quotes alone.
      - name: Coverage floor (backend/services)
        shell: pwsh
        run: |
          $floor = 35.0
          go test ./backend/services/ "-coverprofile=coverage.out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $total = go tool cover "-func=coverage.out" | Select-String '^total:'
          if (-not $total) {
            Write-Host "Could not find a total line in the coverage profile."
            exit 1
          }
          $pct = [double]($total.Line -replace '.*?([0-9.]+)%.*', '$1')
          Write-Host "backend/services coverage: $pct% (floor: $floor%)"
          if ($pct -lt $floor) {
            Write-Host "Coverage $pct% is below the $floor% floor."
            Write-Host "Add tests for what you changed, or justify moving the floor."
            exit 1
          }

  backend-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Only shipping platform whose !windows Go code (server_linux.go,
      # server_unix.go, server_other.go) isn't otherwise compiled anywhere in
      # CI — the windows-latest backend job above never touches those files.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          # The workspace is bind-mounted from the host and owned by a
          # different uid than this container's root, so git refuses to touch
          # it — which breaks go build's VCS stamping (exit 128).
          # actions/checkout sets this too, but only in a temporary global
          # config that doesn't survive its own step.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - run: go vet ./...
      - run: go test ./...
      - run: go build -tags webkit2_41 ./...
