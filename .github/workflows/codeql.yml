# Vendored into every product in suite.repos.json as .github/workflows/codeql.yml
# by scripts/sync-workflows.sh. Edit it here. The next sync overwrites the copy
# in a product, the same way it overwrites a hand-edited tokens.source.json.
#
# One file for both products is possible because they carry the same four
# languages: the workflow files themselves, a Go shell, a TypeScript frontend,
# and the Python under .github/scripts/ and .claude/. A product that grows a
# fifth language changes the matrix here, for both.
#
# Go is on autobuild knowing the build does not finish on a bare runner: each
# shell embeds a frontend that is a pnpm build away and gitignored, and links
# against webkit2gtk headers the runner lacks. The Go extractor keeps going
# past those errors and scans what compiled, which Konnekt's runs put at
# roughly two thirds of its Go files. A manual build step would close that gap
# at the cost of a per-product build recipe in a file that is shared verbatim,
# so it stays partial until that trade looks worth it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '36 14 * * 0'

# The default for any job added later. analyze declares the scopes it needs
# itself, and a job-level block replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
