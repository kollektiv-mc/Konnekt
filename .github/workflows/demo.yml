# Builds the browser demo and publishes it.
#
# Separate from the site. website/ has no build step, no package.json and no
# node_modules — agent_docs/CLAUDE.md is explicit about that — and dropping a
# built bundle into it would take that property away. The demo is its own
# Cloudflare Pages project instead, and the site links out to it.
#
# Published from three triggers. A release is what the demo is *of*, so a tag
# rebuilds it and the demo can never be older than the newest build; a nightly
# run keeps it honest between releases; and workflow_dispatch publishes on
# demand. A pull request that touches the demo runs the build and its checks
# but neither films nor publishes, so a binding the demo does not answer is red
# before it merges. A scene that can no longer find its controls is red at the
# next nightly run instead, which is the trade for not installing ffmpeg and a
# browser and filming every scene on every pull request. None of them ever
# writes frontend/dist, which main.go embeds and check-bundle measures.
#
# The website's feature clips are filmed here too (demo/record.mjs), from the
# very build that is published, and shipped beside it under /scenes/. That is
# what keeps them from ever being older than the demo they sit next to.

name: demo

on:
  # GitHub runs a schedule on the latest commit of the default branch, and
  # delays runs at the start of every hour, so this sits off the hour. In a
  # public repository it is disabled after 60 days without activity.
  schedule:
    - cron: "17 3 * * *"
  # Nothing else can change what the demo renders. A website-only or docs-only
  # pull request would otherwise build it for no reason. The publish step and
  # the filming are gated on the event, so this never films or deploys.
  pull_request:
    paths:
      - "frontend/**"
      - "demo/**"
      - "backend/services/scheduler_blocks*.go"
      - ".github/workflows/demo.yml"
  release:
    types: [published]
  workflow_dispatch:

# The job reads the repository and talks to Cloudflare with Cloudflare's own
# token, so the GITHUB_TOKEN needs nothing beyond checkout. Declared rather than
# left to the default, which is what CodeQL flags.
permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scheduler palette is generated from backend/services, so this job
      # needs Go as well as node. Nothing else in the demo touches the backend.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Fails on a bound method the demo does not answer, which is the whole
      # point of running this on main: a binding added to app.go shows up here
      # as a red build rather than as a tile that silently does nothing.
      - run: node demo/build.mjs

      # blockdefs.json is committed so the fixtures stay readable and diffable,
      # and regenerated by the build above — so a block added to
      # scheduler_blocks.go without a regenerate shows up here as a diff. The
      # same bargain the token layer makes in ci.yml.
      - name: The generated block palette is in sync
        run: git diff --exit-code demo/backend/fixtures/blockdefs.json

      # ── The clips ────────────────────────────────────────────────────────
      # Skipped on a pull request, which only builds; see the header. The
      # publish step needs the clips, so whatever publishes also films.
      #
      # The runner image ships Chromium but no ffmpeg, and demo/record.mjs
      # wants libvpx-vp9, libx264 and libwebp, which Ubuntu's package has.
      # Playwright's own Chromium is the one its devDependency pins, so the
      # recording runs on the same build everywhere; --with-deps installs the
      # shared libraries it needs on the runner.
      - name: Install ffmpeg
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install the recorder's browser
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      # Films every scene under demo/scenes/ against demo/dist and writes the
      # clips into it. A scene whose tile has moved its controls fails here,
      # and fails the publish with it, so a broken scene never ships a demo
      # with a clip missing.
      - name: Film the scenes
        if: github.event_name != 'pull_request'
        run: node demo/record.mjs

      # frontend/dist is what main.go embeds and what check-bundle-size.mjs
      # measures. The demo builds to demo/dist via --outDir, and this is the
      # assertion that it stayed there.
      - name: The demo build left frontend/dist alone
        run: |
          if [ -e frontend/dist ]; then
            echo "frontend/dist exists after a demo build — the --outDir flag is not holding."
            exit 1
          fi

      - name: Publish
        # Skipped on a pull request, and wherever the variable is unset, such
        # as a fork, where the secrets do not exist either.
        #
        # Wrangler comes from npx rather than cloudflare/wrangler-action. The
        # action sees pnpm on the runner and runs `pnpm add wrangler` in the
        # repository root, which pnpm 11 refuses: wrangler's esbuild and workerd
        # carry build scripts nobody has approved, and that is exit code 1. The
        # first run on main failed exactly there, after the build and both
        # checks had passed. npx fetches a pinned major into its own cache and
        # touches nothing in the tree.
        #
        # --branch is explicit because a release checks out a tag, not a branch,
        # and a deploy that names any branch but the project's production
        # branch lands as a preview rather than at <project>.pages.dev.
        if: github.event_name != 'pull_request' && vars.DEMO_PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.DEMO_PAGES_PROJECT }}
        run: npx --yes wrangler@4 pages deploy demo/dist --project-name="$PROJECT" --branch=main
