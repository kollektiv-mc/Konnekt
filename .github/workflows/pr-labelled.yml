# Vendored into every product in suite.repos.json as
# .github/workflows/pr-labelled.yml by scripts/sync-workflows.sh. Edit it here.
# The next sync overwrites the copy in a product, the same way it overwrites a
# hand-edited tokens.source.json.
#
# The pull-request label gate. It reports as a commit status named
# `pr-labelled` rather than as a job that fails: a pull request opened without
# its labels yet reads as pending (yellow), not failed, and turns green when the
# `labeled` event for the last missing one arrives. A failing job did the same
# blocking, but sent a "run failed" notification on every pull request in the
# seconds between opening it and labelling it.
#
# Why a status and not a job that waits: a job cannot stay pending until a
# person acts. It holds a runner, is billed for the minutes, and dies at its
# timeout. A commit status costs one API call and stays `pending` for as long
# as the labels are missing. The job that posts it always succeeds, so it is
# named `post-status` to keep it from reading as the gate. GitHub requires every
# check and status that carries a required name to pass, so a branch rule
# requiring `pr-labelled` is held by this status with nothing to reconfigure.
#
# Why a gate at all: a merged pull request's `type:` label is the only input to
# the release notes, and its `area:` label is the issue-side rule holding on the
# pull-request side, so what a change touches is recorded in one vocabulary
# whether it is asked for or delivered. Before Konnekt gated this, 24 of the 41
# pull requests in its first release window carried no label, and the generator
# had to guess from titles. kollektiv's docs/conventions.md, § Release notes and
# pull request labelling, is the rule; this is the check.
#
# Why `pull_request_target`: under `pull_request` the token is read-only for a
# pull request from a fork, and for Dependabot's, so the status could never be
# written there. The usual hazard of that trigger is checking out and running
# the pull request's code with a write token. Nothing here is checked out or
# run; the job reads label names and writes one status.
name: pr-labelled

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

# Label events arrive in bursts, one per label. Serialised so an earlier run
# cannot overwrite a later one's verdict.
concurrency:
  group: pr-labelled-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  post-status:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      # Labels are read from the API rather than the event payload, because the
      # payload is a snapshot from when the event fired and a queued run would
      # otherwise post a verdict on labels that have since changed. Via env
      # rather than interpolated into the script: label names are
      # attacker-shaped text as far as a shell is concerned, and `${{ }}` inside
      # a run block is substituted before bash ever sees it.
      - name: 'Post pr-labelled: pending until a type: and an area: label are on'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          DOCS: https://github.com/kollektiv-mc/Kollektiv/blob/main/docs/conventions.md#which-type-label
        run: |
          labels=$(gh api "repos/$REPO/pulls/$NUMBER" --jq "[.labels[].name]")
          echo "labels: $labels"
          has() { echo "$labels" | jq -e --arg p "$1" 'any(.[]; startswith($p))' > /dev/null; }
          state=pending
          if has type: && has area:; then
            state=success
            description="Has a type: and an area: label"
          elif has area:; then
            description="Waiting for a type: label"
          elif has type:; then
            description="Waiting for an area: label"
          else
            description="Waiting for a type: and an area: label"
          fi
          echo "$state: $description"
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context=pr-labelled \
            -f description="$description" -f target_url="$DOCS" > /dev/null
