# https://lefthook.dev/configuration/
#
# Formats staged files on the way in. This used to be a migration strategy —
# the repo had a formatting style predating Prettier, so it was cleaned
# on-touch rather than all at once — but the tree is fully formatted now and
# CI runs `pnpm format:check`, so this is ordinary maintenance: it fixes your
# staged files locally instead of letting CI fail on them.
#
# Note the frontend glob below is *.{ts,tsx,css}. Prettier itself also covers
# the repo's JSON and .mjs; those are only checked in CI, not fixed here.
# website/ has its own job at the bottom, with its own Prettier config.
pre-commit:
  parallel: true
  jobs:
    - name: frontend format
      root: "frontend/"
      glob: "*.{ts,tsx,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: frontend lint
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: frontend typecheck
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck

    # website/ is plain HTML/CSS/ES modules with its own Prettier config (no
    # Tailwind, so no class-sorting plugin). Prettier itself still lives in
    # frontend/ — one version in the repo, not two — hence the path rather than
    # `pnpm exec`: the repo root has only lefthook in node_modules, and
    # `pnpm --dir frontend exec` would change cwd and break {staged_files}.
    # Running with root: "website/" also means Prettier's default ignore-file
    # lookup finds website/.prettierignore on its own, so tokens.css is skipped.
    - name: website format
      root: "website/"
      glob: "*.{html,css,js}"
      run: node ../frontend/node_modules/prettier/bin/prettier.cjs --write {staged_files}
      stage_fixed: true

    - name: go format
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: go vet
      glob: "*.go"
      run: go vet ./...
