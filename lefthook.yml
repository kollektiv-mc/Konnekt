# https://lefthook.dev/configuration/
#
# Formats staged files on the way in. This used to be a migration strategy —
# the repo had a formatting style predating Prettier, so it was cleaned
# on-touch rather than all at once — but the tree is fully formatted now and
# CI runs `pnpm format:check`, so this is ordinary maintenance: it fixes your
# staged files locally instead of letting CI fail on them.
#
# Note the glob below is *.{ts,tsx,css}. Prettier itself also covers the
# repo's HTML, JSON and .mjs; those are only checked in CI, not fixed here.
pre-commit:
  parallel: true
  jobs:
    - name: frontend format
      root: "frontend/"
      glob: "*.{ts,tsx,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: frontend lint
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: frontend typecheck
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm run typecheck

    - name: go format
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: go vet
      glob: "*.go"
      run: go vet ./...
